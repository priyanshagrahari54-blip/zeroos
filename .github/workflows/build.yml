name: ZEROOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils grub-pc-bin grub-common xorriso qemu-system-x86

      - name: Build ZEROOS
        run: make

      - name: Verify kernel image
        run: |
          test -s build/zeroos.elf
          test -s build/zeroos.iso
          file build/zeroos.elf build/zeroos.iso

      - name: Boot test
        run: |
          timeout 10s qemu-system-x86_64             -cdrom build/zeroos.iso             -serial file:build/serial.log             -display none || true
          grep -q "ZEROOS: foundation milestone reached." build/serial.log
