name: ZEROOS Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build ZEROOS
        run: make

      - name: Verify kernel image
        run: |
          test -s build/zeroos.elf
          test -s build/zeroos.iso
          file build/zeroos.elf build/zeroos.iso
          readelf -h -l build/zeroos.elf
          objdump -s -j .multiboot2 build/zeroos.elf
          echo "===== ZEROOS linker symbols ====="
          nm -n build/zeroos.elf | grep -E '(__kernel_start|__kernel_end|stack_bottom|stack_top|tasks$|task_lock$|next_task_id$|sleep_head$|tick_hook$|ticks$|page_bitmap|free_word_summary)' || true
          echo "===== ZEROOS memory_init disassembly ====="
          objdump -d --disassemble=memory_init build/zeroos.elf
          echo "===== ZEROOS task context disassembly ====="
          objdump -d --disassemble=task_trampoline build/zeroos.elf
          objdump -d --disassemble=switch_to_next build/zeroos.elf
          objdump -d --disassemble=task_yield build/zeroos.elf

      - name: Boot test
        run: |
          timeout 10s qemu-system-x86_64             -cdrom build/zeroos.iso             -serial file:build/serial.log             -display none             -no-reboot             -no-shutdown             -debugcon file:build/debug.log             -global isa-debugcon.iobase=0xe9             -d guest_errors,cpu_reset             -D build/qemu.log || true
          grep -q "ZEROOS: foundation milestone reached." build/serial.log
          grep -q "ZEROOS: physical page allocator initialized." build/serial.log
          grep -q "ZEROOS: runtime GDT/TSS self-test passed." build/serial.log
          test -s build/debug.log
          grep -q "B" build/debug.log
          grep -q "L" build/debug.log
          grep -q "ZEROOS: timer tick 100." build/serial.log

          echo "===== ZEROOS scheduler certification gates ====="
          grep -q "ZEROOS: task context-switch self-test passed." build/serial.log
          grep -q "ZEROOS: wait queue integration verified." build/serial.log
          grep -q "ZEROOS: timed sleep integration verified." build/serial.log
          grep -q "ZEROOS: timer-only preemption stress passed." build/serial.log
          grep -q "ZEROOS: zombie reaping and slot-reuse stress passed." build/serial.log
          grep -q "ZEROOS: scheduler certification passed." build/serial.log
          grep -q "ZEROOS: process/thread object model self-test passed." build/serial.log
          grep -q "ZEROOS: PID/TID reuse protection self-test passed." build/serial.log

          if grep -q "ZEROOS PANIC:" build/serial.log; then
            echo "ZEROOS scheduler/runtime panic detected:"
            grep "ZEROOS PANIC:" build/serial.log
            exit 1
          fi

      - name: Dump serial log on failure
        if: failure()
        run: |
          echo "===== ZEROOS serial.log ====="
          if test -f build/serial.log; then
            cat build/serial.log
          else
            echo "serial.log was not produced"
          fi
          echo "===== ZEROOS debug port ====="
          if test -f build/debug.log; then cat build/debug.log; else echo "debug.log was not produced"; fi
          echo "===== QEMU diagnostics ====="
          if test -f build/qemu.log; then
            cat build/qemu.log
          else
            echo "qemu.log was not produced"
          fi
